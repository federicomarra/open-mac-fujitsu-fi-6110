name: Build & Release

# Every push to main (and manual runs) bump the version by +0.1, build the
# universal .app, and publish the .dmg as both a GitHub Release and a workflow
# artifact. The version is derived from the latest git tag (no tags => 1.0);
# CI never commits back to the repo — it only pushes the tag and the Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the version tag and create the Release

concurrency:
  group: release-main # serialize runs so two releases can't race
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14 # Apple Silicon; cross-compiles the x86_64 slice too

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, so release notes can list commits

      - name: Compute next version
        run: |
          # Highest existing tag is the source of truth (checkout fetched all
          # tags via fetch-depth: 0). Strip the leading v, add 0.1. No tags => 1.0.
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest" ]; then
            new=$(awk -v v="${latest#v}" 'BEGIN{printf "%.1f", v + 0.1}')   # v1.9 -> 2.0
          else
            new=1.0                                                          # first release
          fi
          echo "VERSION=$new"       >> "$GITHUB_ENV"
          echo "LATEST_TAG=$latest" >> "$GITHUB_ENV"   # reused as the changelog base
          echo "Building version $new (from tag '${latest:-none}')"

      - name: Install pkg-config
        run: brew install pkgconf # the SANE vendor build uses it to find libusb

      - name: Cache vendor libraries
        uses: actions/cache@v5
        with:
          path: |
            vendor/out
            vendor/src
          key: vendor-${{ runner.os }}-${{ hashFiles('vendor/build-sane.sh') }}

      - name: Build vendor libraries (if not cached)
        run: test -f vendor/out/lib/libsane-fujitsu.so || vendor/build-sane.sh

      - name: Stamp version into Info.plist
        run: |
          plist=packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"

      - name: Build app + DMG
        run: |
          packaging/make-icon.sh
          packaging/make-app.sh
          packaging/make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: fi-6110-Scanner-${{ env.VERSION }}
          path: dist/fi-6110 Scanner.dmg
          if-no-files-found: error

      - name: Tag and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag the pushed commit under my identity: an annotated tag records the
          # tagger (me), not github-actions. Changelog base is the previous latest
          # tag captured in "Compute next version" (empty on the first release).
          git config user.name  "Federico Marra"
          git config user.email "fecrom@gmail.com"
          git tag -a "v$VERSION" -m "fi-6110 Scanner v$VERSION"
          git push origin "v$VERSION"

          range="${LATEST_TAG:+$LATEST_TAG..HEAD}"

          # Release notes from real commit subjects since the previous tag.
          {
            echo "## Novità in questa versione / What's changed"
            echo ""
            git log $range --no-merges --pretty=format:'- %s' \
              | grep -v '\[skip ci\]' || echo "- Prima versione."
            echo ""
            echo ""
            echo "---"
            echo "Trascina l'app in **Applicazioni**. Al primo avvio: clic destro sull'app → **Apri**."
            echo "_(Drag the app to Applications; on first launch right-click the app → Open.)_"
          } > release-notes.md

          gh release create "v$VERSION" "dist/fi-6110 Scanner.dmg" \
            --title "fi-6110 Scanner v$VERSION" \
            --notes-file release-notes.md
